name: Assign on move to In Progress
on:
  project_card:
    types: [moved]
jobs:
  assign_to_mover:
    runs-on: ubuntu-latest
    if: |
      github.event.project_card.column_name == 'Сцены в работе' &&
      github.event.project.name == 'Бронь сцен'
    steps:
      - name: Assign to mover
        uses: actions/github-script@v7
        with:
          script: |
            const mover = context.payload.sender.login;
            const issueUrl = context.payload.project_card.content_url;
            if (!issueUrl.includes('/issues/')) return;
            const issueNumber = issueUrl.split('/').pop();
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [mover]
            });
