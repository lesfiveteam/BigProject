name: Assign on move to In Progress
on:
  project_card:
    types: [moved]
jobs:
  assign_to_mover:
    runs-on: ubuntu-latest
    steps:
      - name: Assign to mover
        uses: actions/github-script@v7
        with:
          script: |
            // Получаем логин пользователя, который переместил карточку
            const mover = context.payload.sender.login;
            // Получаем номер issue из карточки (если это issue)
            const issueUrl = context.payload.project_card.content_url;
            if (!issueUrl.includes('/issues/')) return;
            const issueNumber = issueUrl.split('/').pop();
            // Назначаем исполнителя
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              assignees: [mover]
            });
